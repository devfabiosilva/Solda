name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      build_ui:
        description: 'Compile and test Qt6 UI?'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: 1234
          POSTGRES_USER: fabio
          POSTGRES_INITDB_ARGS: "-U fabio"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release]
        c_compiler: [gcc]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Intall PostgresSQL 14 dev header server
      timeout-minutes: 30
      shell: bash
      run: |
        sudo apt update
        sudo apt install postgresql-server-dev-16

    - name: Set reusable strings
      timeout-minutes: 30
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup PostgreSQL
      timeout-minutes: 30
      shell: bash
      run: |
        # Wait for PostgreSQL to be ready
        until pg_isready -h localhost -p 5432 -U fabio; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 1
        done
        echo "PostgreSQL is ready!"
      env:
        PGPASSWORD: 1234

    - name: Create solda_mvp database
      timeout-minutes: 30
      shell: bash
      run: |
        createdb -h localhost -U fabio solda_mvp
        echo "Database solda_mvp created successfully!"
      env:
        PGPASSWORD: 1234

    - name: Load mock database
      timeout-minutes: 30
      shell: bash
      run: |
        # Restore the database from dump file (custom format)
        pg_restore -h localhost -U fabio -d solda_mvp tests/solda_mvp.dump
        echo "Database restored successfully!"
      env:
        PGPASSWORD: 1234

    - name: Install coverage tools
      timeout-minutes: 30
      shell: bash
      run: |
        if [ "${{ matrix.build_type }}" = "Debug" ]; then
          sudo apt-get update
          sudo apt-get install -y lcov
        else
          echo "Release mode. Ignoring ..."
        fi

    - name: Configure CMake
      timeout-minutes: 30
      shell: bash
      run: |
        if [ "${{ matrix.build_type }}" = "Release" ]; then
          echo "Configuring Release build (ASAN disabled)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DASAN=OFF
        elif [ "${{ matrix.build_type }}" = "Debug" ]; then
          echo "Configuring ${{ matrix.build_type }} build (ASAN enabled)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DASAN=ON
        else
          echo "Unknown option: ${{ matrix.build_type }}"
          exit 1
        fi

    - name: Build
      timeout-minutes: 30
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      timeout-minutes: 30
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --verbose --build-config ${{ matrix.build_type }}

    - name: Generating coverage ...
      timeout-minutes: 30
      shell: bash
      run: |
        if [ "${{ matrix.build_type }}" = "Debug" ]; then
          cd "${{ steps.strings.outputs.build-output-dir }}" || exit 1
          lcov --directory . --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
          genhtml coverage.info --output-directory coverage-html
        else
          echo "Release mode. Ignoring coverage..."
        fi

    - name: Upload Coverage Report Website
      if: ${{ matrix.build_type == 'Debug' }}
      uses: actions/upload-artifact@v4
      with:
        name: core-code-coverage-report
        path: ${{ steps.strings.outputs.build-output-dir }}/coverage-html/

  build_ui:
    runs-on: ${{ matrix.os }}
    # if: ${{ github.event.inputs.build_ui == 'true' }} # Ignoring. Not working. Why?

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: 1234
          POSTGRES_USER: fabio
          POSTGRES_INITDB_ARGS: "-U fabio"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [QT6_Debug, QT6_Release]
        c_compiler: [gcc]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Cache Qt installation
      timeout-minutes: 30
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/Qt
        key: ${{ runner.os }}-qt6-11-1-cache-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-qt6-11-1-cache-

    - name: Install Qt 6.11.1
      timeout-minutes: 30
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.1'
        cached: ${{ steps.cache-qt.outputs.cache-hit }}
        dir: ${{ github.workspace }}

    - name: Install System Dependencies (Linux)
      timeout-minutes: 30
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev libcups2-dev

    - name: Intall PostgresSQL 14 dev header server
      timeout-minutes: 30
      shell: bash
      run: |
        sudo apt update
        sudo apt install postgresql-server-dev-16

    - name: Set reusable strings
      timeout-minutes: 30
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup PostgreSQL
      timeout-minutes: 30
      shell: bash
      run: |
        # Wait for PostgreSQL to be ready
        until pg_isready -h localhost -p 5432 -U fabio; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 1
        done
        echo "PostgreSQL is ready!"
      env:
        PGPASSWORD: 1234

    - name: Create solda_mvp database
      timeout-minutes: 30
      shell: bash
      run: |
        createdb -h localhost -U fabio solda_mvp
        echo "Database solda_mvp created successfully!"
      env:
        PGPASSWORD: 1234

    - name: Load mock database
      timeout-minutes: 30
      shell: bash
      run: |
        # Restore the database from dump file (custom format)
        pg_restore -h localhost -U fabio -d solda_mvp tests/solda_mvp.dump
        echo "Database restored successfully!"
      env:
        PGPASSWORD: 1234

    - name: Configure CMake
      timeout-minutes: 30
      shell: bash
      run: |
        if [ "${{ matrix.build_type }}" = "QT6_Debug" ]; then
          echo "Configuring ${{ matrix.build_type }} build (ASAN enabled)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DASAN=ON -DONLY_SOLDA_CORE=OFF -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.11.1/gcc_64"
        elif [ "${{ matrix.build_type }}" = "QT6_Release" ]; then
          echo "Configuring Release build (ASAN disabled)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DASAN=OFF -DONLY_SOLDA_CORE=OFF -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.11.1/gcc_64"
        else
          echo "Unknown option: ${{ matrix.build_type }}"
          exit 1
        fi

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --verbose --build-config ${{ matrix.build_type }}
