name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: 1234
          POSTGRES_USER: fabio
          POSTGRES_INITDB_ARGS: "-U fabio"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release]
        c_compiler: [gcc]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup PostgreSQL
      shell: bash
      run: |
        # Wait for PostgreSQL to be ready
        until pg_isready -h localhost -p 5432 -U fabio; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 1
        done
        echo "PostgreSQL is ready!"
      env:
        PGPASSWORD: 1234

    - name: Load mock database
      shell: bash
      run: |
        # Restore the database from dump file
        psql -h localhost -U fabio -f tests/solda_mvp.dump
        echo "Database restored successfully!"
      env:
        PGPASSWORD: 1234

    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ matrix.build_type }}" = "Release" ]; then
          echo "Configuring Release build (ASAN disabled)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DASAN=OFF
        else
          echo "](#)

